[package]
name = "tensogram-grib"
version = "0.24.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
description = "GRIB to Tensogram format importer using ecCodes"
repository = "https://github.com/ecmwf/tensogram"
homepage = "https://sites.ecmwf.int/docs/tensogram/main"
documentation = "https://sites.ecmwf.int/docs/tensogram/main"
readme = "README.md"
keywords = ["tensogram", "grib", "weather", "scientific-data", "eccodes"]
categories = ["science"]
authors = ["ECMWF <software@ecmwf.int>"]

[dependencies]
tensogram = { path = "../tensogram", version = "=0.24.0" }
tensogram-encodings = { path = "../tensogram-encodings", version = "=0.24.0" }
# Official ECMWF bindings; git until the crates are published on crates.io.
eccodes = { git = "https://github.com/ecmwf/eccodes.git", branch = "eccodes-compat", default-features = false, features = ["vendored", "aec"] }
thiserror = "2"
ciborium = "0.2"

[dev-dependencies]
tempfile = "3"
