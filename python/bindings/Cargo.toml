[package]
name = "tensogram-python"
version = "0.24.0"
edition = "2024"
publish = false

[lib]
name = "tensogram"
crate-type = ["cdylib"]

[features]
default = ["async", "mmap"]
async = ["tensogram-lib/async", "dep:pyo3-async-runtimes", "dep:tokio"]
# Memory-mapped file reads. Forwards to the core crate's `mmap` feature
# (pulls in `memmap2`, a lightweight pure-Rust crate). When enabled,
# `TensogramFile.open_mmap(path)` maps the file for zero-copy scans;
# when off, the method is compiled out and `__has_mmap__` is False.
mmap = ["tensogram-lib/mmap"]
# Opt-in wrappers for GRIB / NetCDF conversion. These pull in the
# `tensogram-grib` / `tensogram-netcdf` crates which link against
# libeccodes / libnetcdf at build time. When the feature is off,
# `tensogram.convert_grib()` / `tensogram.convert_netcdf()` still
# exist in the Python module but raise a `RuntimeError` at call
# time (see `src/lib.rs::py_convert_grib` for the stub implementation).
grib = ["dep:tensogram-grib"]
netcdf = ["dep:tensogram-netcdf"]

[dependencies]
tensogram-lib = { package = "tensogram", path = "../../rust/tensogram", features = ["remote"] }
tensogram-encodings = { path = "../../rust/tensogram-encodings" }
tensogram-grib = { path = "../../rust/tensogram-grib", optional = true }
tensogram-netcdf = { path = "../../rust/tensogram-netcdf", optional = true }
pyo3 = { version = "0.28", features = ["extension-module"] }
numpy = "0.28"
ciborium = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pyo3-async-runtimes = { version = "0.28", features = ["tokio-runtime"], optional = true }
# `tokio::sync::Mutex` guards the async streaming encoder so the lock can be
# held across `.await`. Only needed with the `async` feature; the encoder
# writes to an in-memory `std::io::Cursor<Vec<u8>>` (tokio implements
# AsyncWrite + AsyncSeek for it), so no extra tokio runtime features are
# required here.
tokio = { version = "1", features = ["sync"], optional = true }
